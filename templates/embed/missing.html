{% load i18n %}{% get_current_language as LANGUAGE_CODE %}<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{ PORTAL_NAME }}</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; padding: 16px; box-sizing: border-box; text-align: center;
      background: radial-gradient(50% 70% at 50% 40%, rgba(34, 211, 238, 0.12), transparent 70%), #05070c;
      color: #8794a8; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    strong { display: block; margin-bottom: 4px; color: #e8eef6; font-size: 17px; }
  </style>
</head>
<body>
  <p><strong>{{ title }}</strong>{{ text }}</p>
  {# The site's script waits for a word from the frame to know it is showing. #}
  <script>if (window.parent !== window) window.parent.postMessage({ type: "qqplay:loaded", missing: true }, "*");</script>
</body>
</html>
