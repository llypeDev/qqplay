{% load i18n %}{% get_current_language as LANGUAGE_CODE %}<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{ PORTAL_NAME }}</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { min-height: 100%; margin: 0; }
    body {
      box-sizing: border-box; padding: 20px; background: #05070c; color: #e8eef6;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .lti-card { max-width: 640px; margin: 6vh auto 0; padding: 22px; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 14px; background: #0b0f17; }
    .lti-card.wide { max-width: 760px; margin-top: 0; }
    h1 { margin: 0 0 8px; font-size: 19px; line-height: 1.3; }
    p { margin: 0 0 10px; color: #a9b4c4; }
    .lti-list { display: grid; gap: 6px; margin: 0 0 14px; padding: 0; list-style: none; max-height: 46vh; overflow-y: auto; }
    .lti-list label { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; cursor: pointer; }
    .lti-list label:has(input:checked) { border-color: #22d3ee; background: rgba(34, 211, 238, 0.08); }
    .lti-list small { margin-left: auto; color: #8794a8; white-space: nowrap; }
    h2 { margin: 14px 0 8px; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: #8794a8; }
    .lti-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    select, button { font: inherit; }
    select { padding: 8px 10px; border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 10px; background: #05070c; color: #e8eef6; }
    button { min-height: 40px; padding: 0 18px; border: 0; border-radius: 10px; background: #22d3ee; color: #04121a; font-weight: 650; cursor: pointer; }
  </style>
</head>
<body>{% block body %}{% endblock %}</body>
</html>
